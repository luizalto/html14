<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ache seu produto — Shopee</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
  body {
    min-height: 100vh;
    background: linear-gradient(160deg, #fff3ee 0%, #ffe4d6 50%, #ffd7c2 100%);
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px;
  }
  .logo {
    font-size: 30px; font-weight: 800; color: #ee4d2d;
    margin-bottom: 6px; letter-spacing: -0.5px;
  }
  .sub {
    color: #6b4a3a; font-size: 15px; text-align: center;
    max-width: 340px; line-height: 1.5; margin-bottom: 30px;
  }
  .sub b { color: #ee4d2d; }
  .search-box {
    width: 100%; max-width: 420px;
    background: #fff; border-radius: 16px;
    box-shadow: 0 8px 30px rgba(238, 77, 45, .15);
    padding: 24px 20px;
  }
  label { font-size: 13px; font-weight: 700; color: #8a5a44; text-transform: uppercase; letter-spacing: .5px; }
  .field {
    display: flex; gap: 8px; margin-top: 10px;
  }
  input {
    flex: 1; font-size: 20px; padding: 14px 16px;
    border: 2px solid #f0c9b8; border-radius: 12px;
    outline: none; text-align: center; color: #333;
    -webkit-appearance: none;
  }
  input:focus { border-color: #ee4d2d; }
  input::placeholder { color: #c9a08d; font-size: 16px; }
  .btn-search {
    background: #ee4d2d; color: #fff; border: none;
    font-size: 17px; font-weight: 700; padding: 0 22px;
    border-radius: 12px; cursor: pointer;
  }
  .btn-search:active { transform: scale(.96); }
  .hint { margin-top: 10px; font-size: 12.5px; color: #a98; text-align: center; }
  .chips { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    background: #fff0ea; color: #ee4d2d; border: 1px solid #f5c4b2;
    padding: 6px 14px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .result { width: 100%; max-width: 420px; margin-top: 22px; display: none; }
  .card {
    background: #fff; border-radius: 16px; padding: 26px 20px;
    box-shadow: 0 8px 30px rgba(238, 77, 45, .15);
    text-align: center;
    animation: pop .25s ease;
  }
  @keyframes pop { from { transform: scale(.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .card .num { font-size: 13px; color: #a98; font-weight: 600; letter-spacing: .5px; }
  .card .nome { font-size: 19px; font-weight: 700; color: #333; margin: 8px 0 20px; line-height: 1.35; }
  .btn-shopee {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(90deg, #ee4d2d, #ff7337);
    color: #fff; text-decoration: none;
    font-size: 18px; font-weight: 800;
    padding: 17px 20px; border-radius: 14px;
    box-shadow: 0 6px 18px rgba(238, 77, 45, .35);
  }
  .btn-shopee:active { transform: scale(.97); }
  .btn-shopee svg { width: 24px; height: 24px; fill: #fff; }
  .erro {
    background: #fff5f3; border: 1px solid #f5c4b2; color: #c0392b;
    border-radius: 12px; padding: 16px; text-align: center;
    font-size: 14.5px; line-height: 1.5;
    animation: pop .25s ease;
  }
  footer { margin-top: 40px; font-size: 12px; color: #b08d7a; text-align: center; }
</style>
</head>
<body>

<div class="logo">🛍️ Achadinhos Shopee</div>
<p class="sub">Ache o produto em 2 passos:<br><b>1.</b> Pegue o número no vídeo &nbsp;·&nbsp; <b>2.</b> Digite aqui embaixo 👇</p>

<div class="search-box">
  <label for="q">Digite o número do produto</label>
  <div class="field">
    <input id="q" type="text" inputmode="numeric" placeholder="Ex: 4000" autocomplete="off">
    <button class="btn-search" onclick="buscar()">Buscar</button>
  </div>
  <div class="hint">O número aparece no vídeo assim: <b>N° 4000</b></div>
  <div class="chips" id="chips"></div>
</div>

<div class="result" id="result"></div>

<footer>Ao comprar pelo botão você apoia nosso trabalho 🧡</footer>

<script>
let produtos = [];

function apenasDigitos(s) { return (s || '').replace(/\D/g, ''); }

function carregar() {
  fetch('links.csv')
    .then(r => r.text())
    .then(txt => {
      const linhas = txt.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
      const cab = linhas[0].split(',');
      const iT = cab.indexOf('T');
      const iLinkConv = cab.indexOf('Link Convertido');
      const iLinkOrig = cab.indexOf('Link Original');
      const iProd = cab.indexOf('Produto');
      produtos = linhas.slice(1).map(l => {
        const c = l.split(',');
        return {
          codigo: (c[iT] || '').trim(),
          digitos: apenasDigitos(c[iT] || ''),
          link: (c[iLinkConv] || c[iLinkOrig] || '').trim(),
          nome: (c[iProd] || '').trim()
        };
      }).filter(p => p.codigo && p.link);
      montarChips();
    })
    .catch(() => {
      document.getElementById('result').style.display = 'block';
      document.getElementById('result').innerHTML =
        '<div class="erro">Não consegui carregar a lista de produtos. Tente recarregar a página.</div>';
    });
}

function montarChips() {
  const el = document.getElementById('chips');
  el.innerHTML = '';
  produtos.slice(0, 6).forEach(p => {
    const b = document.createElement('span');
    b.className = 'chip';
    b.textContent = 'N° ' + p.digitos;
    b.onclick = () => { document.getElementById('q').value = p.digitos; buscar(); };
    el.appendChild(b);
  });
}

function buscar() {
  const q = apenasDigitos(document.getElementById('q').value);
  const box = document.getElementById('result');
  box.style.display = 'block';
  if (!q) {
    box.innerHTML = '<div class="erro">Digite o número do produto que aparece no vídeo 🙂</div>';
    return;
  }
  const qn = String(parseInt(q, 10)); // remove zeros à esquerda
  const achou = produtos.find(p =>
    p.digitos === q || String(parseInt(p.digitos, 10)) === qn
  );
  if (!achou) {
    box.innerHTML = '<div class="erro">Produto <b>N° ' + q + '</b> não encontrado.<br>Confira o número no vídeo e tente de novo.</div>';
    return;
  }
  const nome = achou.nome || ('Produto N° ' + achou.digitos);
  box.innerHTML =
    '<div class="card">' +
      '<div class="num">N° ' + achou.digitos + '</div>' +
      '<div class="nome">' + nome + '</div>' +
      '<a class="btn-shopee" href="' + achou.link + '" target="_blank" rel="noopener">' +
        '<svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45C4.52 15.37 5.48 17 7 17h12v-2H7l1.1-2h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1 1 0 0 0 20 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>' +
        'Ver produto na Shopee' +
      '</a>' +
    '</div>';
}

document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); });
carregar();
</script>
</body>
</html>
